name: CI - Testes e Qualidade de Código

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Testes Automatizados (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Inicializar Bancos e Seeding Sintético
        run: |
          python database/init_db.py --seed

      - name: Executar Linter (Ruff)
        run: |
          ruff check src tests database

      - name: Executar Testes Unitários
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Executar Bateria de Cenários End-to-End
        run: |
          python tests/executar_bateria_testes.py
