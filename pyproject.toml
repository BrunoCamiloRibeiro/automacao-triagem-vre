[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automacao-triagem-vre"
version = "2.2.0"
description = "Sistema de alta performance para automação de triagem, herança normativa de CNAEs e distribuição de fiscalização do Via Rápida Empresa (VRE)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Inspetoria Fiscal - SMAURB", email = "suporte.fiscalizacao@riopreto.sp.gov.br" }
]
keywords = [
    "vre",
    "via-rapida-empresa",
    "smaurb",
    "automacao",
    "fiscalizacao",
    "sqlite",
    "openpyxl",
    "triagem",
    "cnae",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: Other Audience",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
    "pyinstaller>=6.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.9.0",
]

[project.scripts]
triagem-vre = "src.runner.main_seco:main"
config-vre = "src.admin.main_admin:main"
importar-antigas = "src.runner.importar_antigas:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
